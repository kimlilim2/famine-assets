<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>만상 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: field-record dossier — sticky roster rail of tabs, then a dense contact-sheet grid of situation frames */
:root{
 --bg:#eceae4; --panel:#f7f6f2; --ink:#16181a; --muted:#5d625f; --line:#cfccc3; --accent:#a8771c; --tag:#24467a; --chip:#e1ded5;
 --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif; --body:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121413;--panel:#1b1e1c;--ink:#ecebe6;--muted:#9da39f;--line:#2e3330;--accent:#e2463c;--tag:#7cc4ad;--chip:#262a28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121413;--panel:#1b1e1c;--ink:#ecebe6;--muted:#9da39f;--line:#2e3330;--accent:#e2463c;--tag:#7cc4ad;--chip:#262a28;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header{display:grid;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:62ch;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec{display:flex;gap:6px;flex-wrap:wrap}
.sec button,.who button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px;padding:6px 12px}
.sec button{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em}
.sec button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;font-size:14px}
.who img{width:30px;height:30px;object-fit:cover;object-position:50% 15%;border-radius:2px}
.who button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.who .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input{font:inherit;flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px}
.hint{font-size:12.5px;color:var(--muted)}
.profile{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;margin:22px 0 14px}
.profile h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1}
.profile p{margin:0;color:var(--muted);grid-column:1/-1;max-width:70ch}
.profile .role{font-family:var(--mono);font-size:12.5px;color:var(--tag)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
figure button.ph{all:unset;cursor:zoom-in;display:block;aspect-ratio:832/1216;background:var(--chip)}
figure button.ph:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
figure img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:7px 8px;border-top:1px solid var(--line);min-width:0}
figcaption .s{font-weight:700;font-size:14px;white-space:nowrap}
.code{font:inherit;font-family:var(--mono);font-size:10.5px;color:var(--tag);background:none;border:1px dashed var(--line);border-radius:2px;padding:2px 5px;cursor:copy;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.code:focus-visible,.sec button:focus-visible,.who button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);padding:30px 0}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,560px);width:100%}
dialog::backdrop{background:rgba(10,10,10,.82)}
.lb{background:var(--panel);color:var(--ink);border-radius:4px;overflow:hidden}
.lb img{width:100%;display:block;max-height:76vh;object-fit:contain;background:#000}
.lb .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px}
.lb .bar b{font-size:16px}
.lb .nav{display:flex;gap:6px}
.lb button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;padding:5px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:3px;font-size:13px;z-index:20}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.who button{font-size:13px}}
@media (prefers-reduced-motion:no-preference){figure{transition:transform .15s}figure:hover{transform:translateY(-2px)}}
</style></head><body>

<div class="wrap">
<header>
 <div class="kicker">각성범죄대응국 기록 보관실 · 만상 도감</div>
 <h1>만상의 회귀자</h1>
 <p class="lede">스토리에 나오는 히로인·조연·엑스트라·마물 이미지를 한곳에 모았습니다. 카드를 누르면 크게 보이고, 아래 코드를 누르면 채팅에 넣는 이미지 코드가 복사됩니다.</p>
 <div class="stats" id="stats">불러오는 중…</div>
</header>
<nav aria-label="분류">
 <div class="sec" id="sec"></div>
 <div class="who" id="who"></div>
 <div class="tools"><label class="hint" for="q">상황 검색</label><input id="q" type="search" placeholder="예: 미소, 전투, 포효"></div>
</nav>
<section id="profile" class="profile"></section>
<div class="grid" id="grid"></div>
<footer>이미지는 모두 성인 등장인물 설정입니다. 히로인은 {{img::이름::상황}} 코드, 그 외는 외부 이미지 주소로 스토리에 나옵니다.</footer>
</div>
<dialog id="dlg"><div class="lb"><img id="lbimg" alt=""><div class="bar"><b id="lbcap"></b><div class="nav"><button id="prev" type="button">이전</button><button id="next" type="button">다음</button><button id="close" type="button">닫기</button></div></div></div></dialog>
<script>
const RAW="https://raw.githubusercontent.com/kimlilim2/famine-assets/main/hunter/";
const SECS=[["heroine","히로인"],["char","조연"],["extra","엑스트라"],["monster","마물"]];
const ORDER="기본 미소 웃음 수줍음 놀람 당황 분노 냉정 슬픔 눈물 오열 걱정 결의 질투 삐짐 감격 경계 신뢰 애정1 애정2 애정3 손잡기 팔짱 기대기 쓰다듬기 이마맞대기 포옹 백허그 무릎베개 업히기 공주님안기 전투 기프트 부상 지침 승리 패배 사복 잠옷 식사 술자리 출동 데이트 퇴근 잠듦 전문 비밀 위기 공격 포효 쓰러짐 공포 환호 현현 대화".split(" ");
const HO="세린 서윤 채아 하린 지아".split(" ");
const META={세린:["강세린",29,"각성범죄대응국 특수수사관 · Lv6 「진실안」","거짓을 용납하지 않는다. 이클립스로 사라진 언니를 찾는다."],서윤:["한서윤",27,"게이트관리청 현장팀장 · Lv5 「결계」","현장 요원을 한 명도 잃지 않으려 한다."],채아:["윤채아",24,"미르 길드 에이스·방송 헌터 · Lv6 「뇌격」","보이지 않으면 없는 것과 같다. 헌터 랭킹 1위를 노린다."],하린:["천하린",21,"태양 길드 · Lv4 · 기프트 없음","아버지 이름 없이 인정받고 싶다."],지아:["민지아",26,"포스관측원 연구원 · 비각성자","측정 불가 포스의 정체를 밝히고 싶다."]};
let D={heroine:[],char:[],extra:[],monster:[]};let sec="heroine",who="세린",q="",cur=[],idx=0;
const $=id=>document.getElementById(id);
const ord=s=>{const i=ORDER.indexOf(s);return i<0?999:i};
async function load(){const t=await fetch("https://api.github.com/repos/kimlilim2/famine-assets/git/trees/main?recursive=1").then(r=>r.json());
 const m={heroine:{},char:{},extra:{},monster:{}};
 for(const it of t.tree){const x=it.path.match(/^hunter\/(heroine|char|extra|monster)\/(.+)_(.+)\.webp$/);if(!x)continue;(m[x[1]][x[2]]=m[x[1]][x[2]]||[]).push([x[3],RAW+x[1]+"/"+encodeURIComponent(x[2]+"_"+x[3])+".webp"]);}
 for(const k in m){let names=Object.keys(m[k]);if(k==="heroine")names=HO.filter(n=>m[k][n]);else names.sort((a,b)=>a.localeCompare(b,"ko"));D[k]=names.map(n=>[n,m[k][n].sort((a,b)=>ord(a[0])-ord(b[0])||a[0].localeCompare(b[0],"ko"))]);}
 try{const s=JSON.parse(localStorage.getItem("mansang")||"{}");if(s.sec&&D[s.sec]&&D[s.sec].length){sec=s.sec;who=s.who||D[sec][0][0]}}catch(e){}
 if(!D[sec].find(([n])=>n===who))who=D[sec][0][0];
 const total=Object.values(D).reduce((a,s)=>a+s.reduce((b,[,it])=>b+it.length,0),0);
 $("stats").innerHTML=`<span>이미지 <b>${total}</b>장</span><span>히로인 <b>${D.heroine.length}</b>명</span><span>조연 <b>${D.char.length}</b>명</span><span>엑스트라 <b>${D.extra.length}</b>종</span><span>마물 <b>${D.monster.length}</b>종</span>`;
 all();}
function save(){try{localStorage.setItem("mansang",JSON.stringify({sec,who}))}catch(e){}}
function code(s){return sec==="heroine"?`{{img::${who}::${s}}}`:`![](${RAW}${sec}/${who}_${s}.webp)`}
function renderSec(){$("sec").innerHTML=SECS.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===sec}">${l} · ${D[k].reduce((a,[,i])=>a+i.length,0)}</button>`).join("");}
function renderWho(){$("who").innerHTML=D[sec].map(([n,it])=>{const t=it.find(x=>x[0]==="기본")||it[0];const m=META[n];return `<button type="button" data-n="${n}" aria-pressed="${n===who}"><img src="${t[1]}" alt="" loading="lazy">${m?m[0]:n}<span class="n">${it.length}</span></button>`}).join("");}
function renderGrid(){const item=D[sec].find(([n])=>n===who);const m=META[who];
 $("profile").innerHTML=m?`<h2>${m[0]}</h2><span class="role">${m[1]}세 · ${m[2]}</span><p>${m[3]}</p>`:`<h2>${who}</h2>`;
 cur=item[1].filter(([s])=>!q||s.includes(q));
 $("grid").innerHTML=cur.length?cur.map(([s,p],i)=>`<figure><button class="ph" type="button" data-i="${i}" aria-label="${who} ${s} 크게 보기"><img src="${p}" alt="${who} ${s}" loading="lazy"></button><figcaption><span class="s">${s}</span><button class="code" type="button" data-c="${code(s).replace(/"/g,'&quot;')}" title="코드 복사">${sec==="heroine"?code(s):"외부 이미지 주소 복사"}</button></figcaption></figure>`).join(""):`<p class="empty">'${q}' 상황 이미지가 없습니다.</p>`;}
function all(){renderSec();renderWho();renderGrid();}
$("sec").onclick=e=>{const b=e.target.closest("button");if(!b)return;sec=b.dataset.k;who=D[sec][0][0];save();all();};
$("who").onclick=e=>{const b=e.target.closest("button");if(!b)return;who=b.dataset.n;save();renderWho();renderGrid();};
$("q").oninput=e=>{q=e.target.value.trim();renderGrid();};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}
function show(i){idx=(i+cur.length)%cur.length;const [s,p]=cur[idx];$("lbimg").src=p;$("lbimg").alt=who+" "+s;$("lbcap").textContent=(META[who]?META[who][0]:who)+" · "+s;}
$("grid").onclick=async e=>{const c=e.target.closest(".code");if(c){try{await navigator.clipboard.writeText(c.dataset.c);toast("복사했습니다")}catch(err){toast("복사에 실패했습니다")}return}
 const b=e.target.closest(".ph");if(b){show(+b.dataset.i);$("dlg").showModal();}};
$("prev").onclick=()=>show(idx-1);$("next").onclick=()=>show(idx+1);$("close").onclick=()=>$("dlg").close();
$("dlg").onclick=e=>{if(e.target.id==="dlg")$("dlg").close()};
document.addEventListener("keydown",e=>{if(!$("dlg").open)return;if(e.key==="ArrowLeft")show(idx-1);if(e.key==="ArrowRight")show(idx+1);});
load().catch(e=>{$("stats").textContent="이미지 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요."});
</script>
</body></html>
